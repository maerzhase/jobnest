packages:
  - "packages/*"
  - "apps/*"

# Supply-chain guardrails for all future dependency resolutions and installs.
minimumReleaseAge: 720
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
blockExoticSubdeps: true
strictDepBuilds: true

# Sharp is pulled in by Next.js and needs its install hook to select the
# platform-specific native package. Keep other native helper hooks disabled.
onlyBuiltDependencies:
  - sharp
ignoredBuiltDependencies:
  - "@parcel/watcher"
  - esbuild

# Next.js 16.2.10 still pins a vulnerable PostCSS patch release.
overrides:
  "next@16.2.10>postcss": 8.5.16
